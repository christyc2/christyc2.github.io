<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
  </head>
  <body>
    <script>
      // GitHub Pages SPA fallback for the user site's root URL.
      (function () {
        var l = window.location;
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            '/?/' +
            l.pathname.slice(1) +
            (l.search ? '&' + l.search.slice(1) : '') +
            l.hash
        );
      })();
    </script>
  </body>
</html>
